<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="4" result="offset" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bgGrad)" rx="16" />

  <!-- Header Title -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    Searchable PDF Export Engine Architecture (투명 텍스트 레이어 결합)
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    pdf-lib 기반 이미지 + 투명 텍스트(opacity:0) 합성 및 동적 폰트 레지스트리 파이프라인
  </text>

  <!-- Column 1: Input & Font Registry -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="260" height="370" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="40" rx="12" fill="#334155" />
    <text x="20" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. 입력 데이터 &amp; 폰트 레지스트리</text>

    <!-- Sub Card 1 -->
    <rect x="15" y="55" width="230" height="75" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="25" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">PdfPageItem[] (활성 페이지만)</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">• isDeleted: false 페이지만 필터</text>
    <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8">• 1..N 순차 재인덱싱 보장</text>

    <!-- Sub Card 2 -->
    <rect x="15" y="145" width="230" height="95" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="25" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">OCR BoundingBoxItem[]</text>
    <text x="25" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">• text, confidence, x, y, w, h (%)</text>
    <text x="25" y="202" font-family="sans-serif" font-size="10" fill="#94a3b8">• 2-Way 교정 완료 텍스트 반영</text>
    <text x="25" y="219" font-family="sans-serif" font-size="10" fill="#94a3b8">• 폰트 크기 비례 자동 계산</text>

    <!-- Sub Card 3 -->
    <rect x="15" y="255" width="230" height="95" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Font Registry (동적 폰트 관리)</text>
    <text x="25" y="295" font-family="sans-serif" font-size="10" fill="#94a3b8">• 기본: StandardFonts.Helvetica</text>
    <text x="25" y="312" font-family="sans-serif" font-size="10" fill="#94a3b8">• 추가: NotoSansKR / Custom TTF</text>
    <text x="25" y="329" font-family="sans-serif" font-size="10" fill="#94a3b8">• 시스템 등록 폰트 즉각 선택 반영</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 310 285 L 345 285" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)" />

  <!-- Column 2: pdf-lib Composition Pipeline -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="270" height="370" rx="12" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="2" />
    <rect width="270" height="40" rx="12" fill="url(#accentIndigo)" />
    <text x="20" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Searchable PDF 합성 엔진</text>

    <!-- Step 1 -->
    <rect x="15" y="55" width="240" height="65" rx="8" fill="#1e293b" stroke="#4f46e5" />
    <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a5b4fc">Step 1. 스캔 이미지 임베딩</text>
    <text x="25" y="93" font-family="sans-serif" font-size="10" fill="#cbd5e1">원본 PNG/JPG 캔버스 바이트 삽입</text>
    <text x="25" y="108" font-family="sans-serif" font-size="9" fill="#94a3b8">하단 배경 레이어로 1:1 무손실 배치</text>

    <!-- Step 2 -->
    <rect x="15" y="130" width="240" height="75" rx="8" fill="#1e293b" stroke="#4f46e5" />
    <text x="25" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a5b4fc">Step 2. 좌표 변환 (Y축 반전)</text>
    <text x="25" y="168" font-family="sans-serif" font-size="9.5" fill="#f8fafc">X = (x / 100) * Width</text>
    <text x="25" y="184" font-family="sans-serif" font-size="9.5" fill="#f8fafc">Y = Height - ((y + h) / 100 * Height)</text>

    <!-- Step 3 -->
    <rect x="15" y="215" width="240" height="65" rx="8" fill="#1e293b" stroke="#4f46e5" />
    <text x="25" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">Step 3. 투명 텍스트 레이어 임베딩</text>
    <text x="25" y="253" font-family="sans-serif" font-size="10" fill="#cbd5e1">page.drawText(text, { opacity: 0 })</text>
    <text x="25" y="268" font-family="sans-serif" font-size="9" fill="#94a3b8">시각적 무영향 + 텍스트 선택/검색 가능</text>

    <!-- Step 4 -->
    <rect x="15" y="290" width="240" height="65" rx="8" fill="#1e293b" stroke="#4f46e5" />
    <text x="25" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Step 4. 메타데이터 &amp; 파일명 생성</text>
    <text x="25" y="328" font-family="sans-serif" font-size="9.5" fill="#fef08a">[도서제목]_ocr_YYYYMMDD.pdf</text>
    <text x="25" y="343" font-family="sans-serif" font-size="9" fill="#94a3b8">Title, Author, Creator 표준 메타 주입</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 630 285 L 665 285" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />

  <!-- Column 3: Output & Client Download -->
  <g transform="translate(670, 100)" filter="url(#shadow)">
    <rect width="250" height="370" rx="12" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5" />
    <rect width="250" height="40" rx="12" fill="url(#accentEmerald)" />
    <text x="20" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. 출력 &amp; 원클릭 다운로드</text>

    <!-- Output Item 1 -->
    <rect x="15" y="55" width="220" height="85" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="25" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">Uint8Array 직렬화</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">• doc.save() 고속 바이너리 생성</text>
    <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8">• 청크 분할로 UI 프리징 방어</text>
    <text x="25" y="129" font-family="sans-serif" font-size="10" fill="#94a3b8">• 진행률(0~100%) 프로그레스 콜백</text>

    <!-- Output Item 2 -->
    <rect x="15" y="155" width="220" height="85" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="25" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">Blob &amp; Object URL 변환</text>
    <text x="25" y="195" font-family="sans-serif" font-size="10" fill="#94a3b8">• new Blob([bytes], application/pdf)</text>
    <text x="25" y="212" font-family="sans-serif" font-size="10" fill="#94a3b8">• URL.createObjectURL 안전 발급</text>
    <text x="25" y="229" font-family="sans-serif" font-size="10" fill="#94a3b8">• 다운로드 완료 후 즉시 Revoke</text>

    <!-- Output Item 3 -->
    <rect x="15" y="255" width="220" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">🎯 브라우저 원클릭 다운로드</text>
    <text x="25" y="295" font-family="sans-serif" font-size="10" fill="#d1fae5">• &lt;a download="..."&gt; 가상 클릭 트리거</text>
    <text x="25" y="312" font-family="sans-serif" font-size="10" fill="#d1fae5">• 파일 크기 및 소요 시간 토스트 안내</text>
    <text x="25" y="329" font-family="sans-serif" font-size="10" fill="#d1fae5">• [도서명]_ocr_YYYYMMDD.pdf 저장</text>
  </g>
</svg>
