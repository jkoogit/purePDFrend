  <text x="40" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800">UI/UX 통일성 및 3대 도메인 IA 그룹화 아키텍처</text>
