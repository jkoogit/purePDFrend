        <rect x="12" y="12" width="60" height="20" rx="4" fill="#1e1b4b" />
        <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 2</text>
