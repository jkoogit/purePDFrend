        <text x="12" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">하네스 / 지식창고 / 스튜디오</text>
      </g>
    
        <path d="M 295 188 L 305 188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
      
      <g transform="translate(310, 140)">
