<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Edge Fade Left Mask -->
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Edge Fade Right Mask -->
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Button Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" rx="16" />
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15" />

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <rect width="90" height="24" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="45" y="16" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">POL-03-14</text>
    <text x="105" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">Scroll-Snap &amp; 스마트 좌우 화살표/페이드 가로 슬라이더 UX 표준</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      가로 스크롤바 완전 숨김 (no-scrollbar) + CSS Scroll-Snap 흡착 + 마우스 드래그/터치 스와이프 제스처
    </text>
  </g>

  <!-- Slider Viewport Container -->
  <g transform="translate(40, 110)">
    <!-- Viewport Track -->
    <rect width="880" height="340" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />

    <!-- Cards Track (Simulated horizontal overflow with snap) -->
    <!-- Card 1 (Partially scrolled out or left-aligned) -->
    <g transform="translate(24, 30)">
      <rect width="250" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="250" height="42" rx="12" fill="#1e293b" />
      <rect x="0" y="30" width="250" height="12" fill="#1e293b" />
      <line x1="0" y1="42" x2="250" y2="42" stroke="#334155" stroke-width="1" />
      
      <!-- Badge & Title -->
      <rect x="14" y="12" width="60" height="18" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
      <text x="44" y="25" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SES-001</text>
      <text x="82" y="26" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">완료됨</text>
      <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">세션 환경 설정 및 점검</text>
      <text x="14" y="95" fill="#64748b" font-family="sans-serif" font-size="11">브랜치: task/session_init</text>
      
      <!-- Snap Point Indicator -->
      <rect x="14" y="244" width="222" height="24" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="125" y="260" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">scroll-snap-align: start</text>
    </g>

    <!-- Card 2 (Active Centered Card) -->
    <g transform="translate(290, 30)">
      <rect width="250" height="280" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
      <rect width="250" height="42" rx="12" fill="#1e1b4b" />
      <rect x="0" y="30" width="250" height="12" fill="#1e1b4b" />
      <line x1="0" y1="42" x2="250" y2="42" stroke="#4f46e5" stroke-width="1" />
      
      <rect x="14" y="12" width="60" height="18" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="0.8"/>
      <text x="44" y="25" fill="#e0e7ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TSK-002</text>
      <text x="82" y="26" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">진행중</text>
      <text x="14" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">모바일 가로 스크롤 개편</text>
      <text x="14" y="95" fill="#a5b4fc" font-family="sans-serif" font-size="11">브랜치: task/모바일UX_IA개편</text>

      <rect x="14" y="130" width="222" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="152" fill="#94a3b8" font-family="sans-serif" font-size="10">✓ CSS Scroll-Snap 흡착</text>
      <text x="24" y="174" fill="#94a3b8" font-family="sans-serif" font-size="10">✓ 좌우 스마트 플로팅 화살표</text>
      <text x="24" y="196" fill="#94a3b8" font-family="sans-serif" font-size="10">✓ 그라디언트 에지 페이드 (Mask)</text>

      <rect x="14" y="244" width="222" height="24" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="125" y="260" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CURRENT ACTIVE SNAPPED</text>
    </g>

    <!-- Card 3 (Peek Card on Right) -->
    <g transform="translate(556, 30)">
      <rect width="250" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="250" height="42" rx="12" fill="#1e293b" />
      <rect x="0" y="30" width="250" height="12" fill="#1e293b" />
      <line x1="0" y1="42" x2="250" y2="42" stroke="#334155" stroke-width="1" />
      
      <rect x="14" y="12" width="60" height="18" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
      <text x="44" y="25" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TSK-003</text>
      <text x="82" y="26" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="bold">대기중</text>
      <text x="14" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="600">성능 벤치마크 및 회고</text>
      <text x="14" y="95" fill="#64748b" font-family="sans-serif" font-size="11">브랜치: dev</text>

      <rect x="14" y="244" width="222" height="24" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="125" y="260" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">scroll-snap-align: start</text>
    </g>

    <!-- Card 4 (Overflow Peeking Card) -->
    <g transform="translate(822, 30)">
      <rect width="180" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <text x="24" y="70" fill="#64748b" font-family="sans-serif" font-size="14">LOOP-004...</text>
    </g>

    <!-- LEFT GRADIENT FADE MASK -->
    <rect x="0" y="0" width="70" height="340" fill="url(#fadeLeft)" rx="14" pointer-events="none" />

    <!-- RIGHT GRADIENT FADE MASK -->
    <rect x="810" y="0" width="70" height="340" fill="url(#fadeRight)" rx="14" pointer-events="none" />

    <!-- SMART LEFT BUTTON (Visible when scrollLeft > 5) -->
    <g transform="translate(16, 146)">
      <circle cx="24" cy="24" r="22" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <path d="M27 16 L19 24 L27 32" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="60" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">이전 (클릭)</text>
    </g>

    <!-- SMART RIGHT BUTTON (Visible when canScrollRight) -->
    <g transform="translate(816, 146)">
      <circle cx="24" cy="24" r="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
      <path d="M21 16 L29 24 L21 32" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="60" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">다음 (클릭)</text>
    </g>
  </g>

  <!-- Gesture & Mouse Drag Guide Footer -->
  <g transform="translate(40, 480)">
    <rect width="880" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="23" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">인터랙션 가이드:</text>
    <text x="125" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      ① 데스크톱: 좌우 스마트 버튼 클릭 (카드 너비 스크롤) 또는 마우스 드래그 (Grab &amp; Drag)
    </text>
    <text x="560" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      ② 모바일: 가로 터치 스와이프 시 카드가 부드럽게 정위치 흡착 (Snap)
    </text>
  </g>
</svg>
