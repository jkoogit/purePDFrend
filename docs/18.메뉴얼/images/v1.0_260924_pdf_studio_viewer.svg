<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0b0f19; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Defs & Gradients -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="#090d16"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  <!-- App Header -->
  <rect x="20" y="16" width="920" height="54" rx="10" fill="url(#headerGrad)" stroke="#312e81" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="50" cy="43" r="14" fill="#4f46e5"/>
  <path d="M44 43 L48 47 L56 39" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="48" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="-0.3">purePDFrend Studio v1.0</text>
  <rect x="250" y="31" width="100" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="262" y="47" fill="#a5b4fc" font-size="11" font-weight="600">800p Virtualized</text>

  <!-- Action Toolbar Buttons -->
  <g transform="translate(620, 29)">
    <rect x="0" y="0" width="86" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="18" fill="#cbd5e1" font-size="11" font-weight="500">레이아웃 편집</text>
    
    <rect x="94" y="0" width="96" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="106" y="18" fill="#cbd5e1" font-size="11" font-weight="500">2-Way 교정기</text>

    <rect x="198" y="0" width="110" height="28" rx="6" fill="url(#accentGrad)"/>
    <text x="210" y="18" fill="#ffffff" font-size="11" font-weight="bold">Searchable PDF</text>
  </g>

  <!-- Left Sidebar (Page Thumbnails Virtual Window) -->
  <rect x="20" y="82" width="200" height="438" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="108" fill="#94a3b8" font-size="12" font-weight="bold">페이지 썸네일 (총 800쪽)</text>
  
  <!-- Thumb 1 (Active) -->
  <rect x="34" y="124" width="172" height="106" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <rect x="46" y="136" width="148" height="68" rx="4" fill="#334155" opacity="0.6"/>
  <text x="46" y="220" fill="#a5b4fc" font-size="11" font-weight="bold">P.1 (정상 0°)</text>
  
  <!-- Thumb 2 -->
  <rect x="34" y="240" width="172" height="106" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="252" width="148" height="68" rx="4" fill="#334155" opacity="0.4"/>
  <text x="46" y="336" fill="#94a3b8" font-size="11">P.2 (정상 0°)</text>

  <!-- Thumb 3 -->
  <rect x="34" y="356" width="172" height="106" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="368" width="148" height="68" rx="4" fill="#334155" opacity="0.4"/>
  <text x="46" y="452" fill="#94a3b8" font-size="11">P.3 (정상 0°)</text>

  <!-- Main Canvas Virtual Viewer -->
  <rect x="232" y="82" width="480" height="438" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="256" y="106" width="432" height="390" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Document Content Preview -->
  <text x="280" y="146" fill="#0f172a" font-size="18" font-weight="bold">Chapter 1. AI 하네스 거버넌스 아키텍처</text>
  <rect x="280" y="162" width="384" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="280" y="176" width="350" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="280" y="190" width="370" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>

  <!-- Transparent Text Overlay & BBox Highlights -->
  <rect x="278" y="220" width="190" height="28" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="284" y="239" fill="#4338ca" font-size="12" font-weight="600">Zero-Hang Web Worker Pipeline</text>
  <rect x="476" y="220" width="180" height="28" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="484" y="239" fill="#047857" font-size="12" font-weight="600">High-Precision OCR Engine</text>

  <rect x="280" y="266" width="384" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="280" y="280" width="360" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="280" y="294" width="340" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>

  <!-- Right Info Panel (OCR / Metrics) -->
  <rect x="724" y="82" width="216" height="438" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="740" y="108" fill="#f8fafc" font-size="13" font-weight="bold">스튜디오 파라미터</text>
  
  <!-- Metric Box 1 -->
  <rect x="738" y="124" width="188" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="750" y="144" fill="#94a3b8" font-size="11">가상 스크롤 렌더링</text>
  <text x="750" y="168" fill="#10b981" font-size="15" font-weight="bold">0ms 메인스레드 지연</text>

  <!-- Metric Box 2 -->
  <rect x="738" y="196" width="188" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="750" y="216" fill="#94a3b8" font-size="11">투명 텍스트 레이어</text>
  <text x="750" y="240" fill="#818cf8" font-size="15" font-weight="bold">100% Searchable</text>

  <!-- Metric Box 3 -->
  <rect x="738" y="268" width="188" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="750" y="288" fill="#94a3b8" font-size="11">Undo/Redo 기록</text>
  <text x="750" y="312" fill="#fbbf24" font-size="15" font-weight="bold">무제한 커맨드 스택</text>

  <!-- Quick Action Box -->
  <rect x="738" y="344" width="188" height="162" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="750" y="368" fill="#c7d2fe" font-size="12" font-weight="bold">단축키 안내</text>
  <text x="750" y="394" fill="#94a3b8" font-size="11">Ctrl+Z : 실행 취소</text>
  <text x="750" y="416" fill="#94a3b8" font-size="11">Ctrl+Y : 다시 실행</text>
  <text x="750" y="438" fill="#94a3b8" font-size="11">R : 90도 시계방향 회전</text>
  <text x="750" y="460" fill="#94a3b8" font-size="11">Del : 페이지 소프트 삭제</text>
  <text x="750" y="482" fill="#94a3b8" font-size="11">Ctrl+S : 완본 PDF 저장</text>
</svg>
