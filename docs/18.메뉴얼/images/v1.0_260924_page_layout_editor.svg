<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0b0f19; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#090d16"/>
  
  <!-- Editor Top Bar -->
  <rect x="20" y="16" width="920" height="54" rx="10" fill="url(#headerGrad)" stroke="#312e81" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="44" y="48" fill="#ffffff" font-size="16" font-weight="bold">📄 PDF 페이지 레이아웃 편집기 &amp; 커맨드 엔진</text>
  
  <!-- Undo / Redo Control Bar -->
  <g transform="translate(480, 28)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="20" fill="#cbd5e1" font-size="11" font-weight="600">⤺ Undo (3)</text>
    
    <rect x="90" y="0" width="80" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="104" y="20" fill="#cbd5e1" font-size="11" font-weight="600">⤻ Redo (0)</text>

    <rect x="180" y="0" width="105" height="30" rx="6" fill="#4338ca"/>
    <text x="194" y="20" fill="#ffffff" font-size="11" font-weight="bold">🔄 90° 일괄회전</text>

    <rect x="295" y="0" width="130" height="30" rx="6" fill="#991b1b"/>
    <text x="307" y="20" fill="#ffffff" font-size="11" font-weight="bold">🗑️ 삭제페이지 정리</text>
  </g>

  <!-- Page Cards Grid (DND Layout) -->
  <g transform="translate(20, 86)">
    <!-- Page Card 1 (Normal 0°) -->
    <rect x="0" y="0" width="215" height="210" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="16" width="175" height="120" rx="6" fill="#ffffff"/>
    <text x="40" y="60" fill="#0f172a" font-size="14" font-weight="bold">Page 1 (표지)</text>
    <rect x="40" y="75" width="135" height="4" fill="#cbd5e1"/>
    <rect x="40" y="85" width="100" height="4" fill="#cbd5e1"/>
    <!-- Card Action Bar -->
    <text x="20" y="166" fill="#f8fafc" font-size="12" font-weight="bold">#1 [ 0° 회전 ]</text>
    <rect x="120" y="150" width="36" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="130" y="166" fill="#cbd5e1" font-size="11">⟳</text>
    <rect x="162" y="150" width="36" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="174" y="166" fill="#ffffff" font-size="11">✕</text>

    <!-- Page Card 2 (Rotated 90°) -->
    <rect x="235" y="0" width="215" height="210" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <g transform="translate(342, 76) rotate(90)">
      <rect x="-60" y="-87" width="120" height="175" rx="6" fill="#ffffff"/>
      <text x="-40" y="-40" fill="#0f172a" font-size="13" font-weight="bold">Page 2 (도표)</text>
      <rect x="-40" y="-20" width="80" height="4" fill="#cbd5e1"/>
    </g>
    <text x="255" y="166" fill="#818cf8" font-size="12" font-weight="bold">#2 [ 90° 시계회전 ]</text>
    <rect x="355" y="150" width="36" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="365" y="166" fill="#cbd5e1" font-size="11">⟳</text>
    <rect x="397" y="150" width="36" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="409" y="166" fill="#ffffff" font-size="11">✕</text>

    <!-- Page Card 3 (Deleted - Soft Deleted) -->
    <rect x="470" y="0" width="215" height="210" rx="10" fill="#18181b" stroke="#7f1d1d" stroke-width="1.5" opacity="0.6"/>
    <rect x="490" y="16" width="175" height="120" rx="6" fill="#e2e8f0" opacity="0.5"/>
    <text x="520" y="80" fill="#dc2626" font-size="16" font-weight="bold">[소프트 삭제됨]</text>
    <text x="490" y="166" fill="#f87171" font-size="12" font-weight="bold">#3 [ 삭제 상태 ]</text>
    <rect x="610" y="150" width="55" height="24" rx="4" fill="#1e293b" stroke="#22c55e"/>
    <text x="622" y="166" fill="#4ade80" font-size="11">복구 ↺</text>

    <!-- Page Card 4 (Drag Target Reorder) -->
    <rect x="705" y="0" width="215" height="210" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="725" y="16" width="175" height="120" rx="6" fill="#ffffff"/>
    <text x="745" y="60" fill="#0f172a" font-size="14" font-weight="bold">Page 4 (결론)</text>
    <text x="725" y="166" fill="#60a5fa" font-size="12" font-weight="bold">#4 [ 드래그 타깃 ]</text>
  </g>

  <!-- Bottom Command/Event Stream Log -->
  <rect x="20" y="316" width="920" height="204" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="344" fill="#94a3b8" font-size="13" font-weight="bold">⚡ 커맨드 실행 및 불변 상태 전이 스트림 (HistoryManager)</text>
  
  <rect x="40" y="358" width="880" height="34" rx="6" fill="#1e293b"/>
  <text x="56" y="380" fill="#4ade80" font-size="12" font-family="monospace">EXECUTE</text>
  <text x="140" y="380" fill="#e2e8f0" font-size="12">ROTATE_PAGE (Page #2 : 0° -> 90° 각도 정규화 전이)</text>
  <text x="760" y="380" fill="#94a3b8" font-size="11">2026-09-24 14:15:20</text>

  <rect x="40" y="398" width="880" height="34" rx="6" fill="#1e293b"/>
  <text x="56" y="420" fill="#f87171" font-size="12" font-family="monospace">SOFT_DEL</text>
  <text x="140" y="420" fill="#e2e8f0" font-size="12">DELETE_PAGE (Page #3 : isDeleted=true 소프트 삭제 마킹)</text>
  <text x="760" y="420" fill="#94a3b8" font-size="11">2026-09-24 14:15:24</text>

  <rect x="40" y="438" width="880" height="34" rx="6" fill="#1e293b"/>
  <text x="56" y="460" fill="#818cf8" font-size="12" font-family="monospace">REORDER</text>
  <text x="140" y="460" fill="#e2e8f0" font-size="12">REORDER_PAGES (Page #4 -> Slot #2 순서 스왑 완료)</text>
  <text x="760" y="460" fill="#94a3b8" font-size="11">2026-09-24 14:15:28</text>

  <rect x="40" y="478" width="880" height="34" rx="6" fill="#1e293b"/>
  <text x="56" y="500" fill="#fbbf24" font-size="12" font-family="monospace">EXPORT</text>
  <text x="140" y="500" fill="#e2e8f0" font-size="12">COMPILE_SEARCHABLE_PDF (소프트 삭제 1개 제외 후 3개 페이지 완본 합성 대기)</text>
  <text x="760" y="500" fill="#94a3b8" font-size="11">2026-09-24 14:15:32</text>
</svg>
