<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0b0f19; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#090d16"/>
  
  <!-- Header -->
  <rect x="20" y="16" width="920" height="54" rx="10" fill="url(#headerGrad)" stroke="#312e81" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="44" y="48" fill="#ffffff" font-size="16" font-weight="bold">🔍 2-Way BBox 캔버스 인라인 OCR 교정기 (OCRCorrectionStudio)</text>
  
  <g transform="translate(680, 28)">
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="12" y="20" fill="#cbd5e1" font-size="11">BBox 자동스냅 On</text>

    <rect x="120" y="0" width="120" height="30" rx="6" fill="#059669"/>
    <text x="132" y="20" fill="#ffffff" font-size="11" font-weight="bold">교정사항 즉시반영</text>
  </g>

  <!-- Left: 2-Way Interactive Canvas with BBoxes -->
  <rect x="20" y="86" width="530" height="434" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="114" fill="#94a3b8" font-size="13" font-weight="bold">인터랙티브 OCR BBox 캔버스 뷰 (Page #1)</text>

  <!-- White Document Page with OCR Regions -->
  <rect x="40" y="130" width="490" height="370" rx="6" fill="#ffffff" filter="url(#shadow)"/>
  
  <text x="65" y="165" fill="#0f172a" font-size="16" font-weight="bold">2-Way BBox Bidirectional Synchronization</text>
  <rect x="65" y="180" width="440" height="6" fill="#94a3b8" opacity="0.3"/>
  <rect x="65" y="194" width="400" height="6" fill="#94a3b8" opacity="0.3"/>

  <!-- Active Selected BBox 1 -->
  <rect x="65" y="220" width="230" height="36" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="75" y="244" fill="#312e81" font-size="13" font-weight="bold">인라인 텍스트 교정 영역 (BBox #1)</text>
  <circle cx="295" cy="220" r="5" fill="#4f46e5"/>
  <circle cx="295" cy="256" r="5" fill="#4f46e5"/>

  <!-- Unselected BBox 2 -->
  <rect x="310" y="220" width="195" height="36" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="320" y="244" fill="#065f46" font-size="13">신뢰도 98.4% (정상)</text>

  <!-- BBox 3 (Low Confidence / Warning) -->
  <rect x="65" y="280" width="440" height="50" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#d97706" stroke-width="2"/>
  <text x="75" y="305" fill="#92400e" font-size="13" font-weight="bold">오인식 텍스트 블록: "purePDFrend Harnezz Engine"</text>
  <text x="75" y="322" fill="#b45309" font-size="11">⚠️ 신뢰도 72.1% (사용자 직접 교정 권장 영역)</text>

  <rect x="65" y="350" width="440" height="6" fill="#94a3b8" opacity="0.3"/>
  <rect x="65" y="364" width="410" height="6" fill="#94a3b8" opacity="0.3"/>
  <rect x="65" y="378" width="370" height="6" fill="#94a3b8" opacity="0.3"/>

  <!-- Right: Synchronized Editor Panel -->
  <rect x="566" y="86" width="374" height="434" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="586" y="114" fill="#f8fafc" font-size="13" font-weight="bold">양방향 실시간 동기화 편집기</text>

  <!-- BBox Detail Form -->
  <g transform="translate(586, 134)">
    <text x="0" y="14" fill="#94a3b8" font-size="11">선택된 블록 식별자</text>
    <rect x="0" y="22" width="334" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="43" fill="#818cf8" font-size="12" font-family="monospace">BBOX-P1-003 (Low Confidence)</text>

    <text x="0" y="78" fill="#94a3b8" font-size="11">OCR 추출 원본 텍스트</text>
    <rect x="0" y="86" width="334" height="32" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <text x="12" y="107" fill="#f87171" font-size="12">purePDFrend Harnezz Engine</text>

    <text x="0" y="142" fill="#38bdf8" font-size="11" font-weight="bold">사용자 교정 텍스트 (실시간 캔버스 연동)</text>
    <rect x="0" y="150" width="334" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="12" y="176" fill="#ffffff" font-size="13" font-weight="bold">purePDFrend Harness Engine</text>

    <!-- Coordinates Setting -->
    <text x="0" y="214" fill="#94a3b8" font-size="11">좌표 및 바운딩 박스 크기 (X, Y, W, H)</text>
    <rect x="0" y="222" width="76" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="242" fill="#cbd5e1" font-size="11">X: 65px</text>
    
    <rect x="86" y="222" width="76" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="96" y="242" fill="#cbd5e1" font-size="11">Y: 280px</text>

    <rect x="172" y="222" width="76" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="182" y="242" fill="#cbd5e1" font-size="11">W: 440px</text>

    <rect x="258" y="222" width="76" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="268" y="242" fill="#cbd5e1" font-size="11">H: 50px</text>

    <!-- Quick Correction Actions -->
    <rect x="0" y="274" width="162" height="36" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="297" fill="#cbd5e1" font-size="12">⤺ 원본 되돌리기</text>

    <rect x="172" y="274" width="162" height="36" rx="6" fill="#4338ca"/>
    <text x="210" y="297" fill="#ffffff" font-size="12" font-weight="bold">✓ 교정 확정</text>
  </g>
</svg>
