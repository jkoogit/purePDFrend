<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lruBox1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lruBox2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="lruBox3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="url(#learnBg)" stroke="#312e81" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    브라우저 대용량 가상 윈도잉 &amp; LRU 메모리가드 동작 메커니즘
  </text>
  <text x="450" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    800페이지(약 1,000,000px) 가상 스크롤 높이 시뮬레이션 및 상하 스페이서와 LRU 큐 관리
  </text>

  <!-- Left: Virtual Viewport Diagram -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="360" height="280" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="180" y="30" fill="#c7d2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      가상 윈도잉 뷰포트 (Viewport Windowing)
    </text>
    
    <!-- Top Spacer -->
    <rect x="20" y="50" width="320" height="40" rx="4" fill="#312e81" stroke="#4f46e5" stroke-dasharray="3"/>
    <text x="180" y="75" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="middle">Top Spacer (p.1 ~ p.397 높이 대치: 447,352px)</text>

    <!-- Visible DOM Slot -->
    <rect x="20" y="100" width="320" height="90" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="180" y="125" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">실제 DOM 렌더링 영역 (2~3개 슬롯만 유지)</text>
    <rect x="40" y="138" width="80" height="42" rx="4" fill="#0284c7"/>
    <text x="80" y="163" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">p.398</text>
    <rect x="140" y="138" width="80" height="42" rx="4" fill="#0284c7"/>
    <text x="180" y="163" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">p.399</text>
    <rect x="240" y="138" width="80" height="42" rx="4" fill="#0284c7"/>
    <text x="280" y="163" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">p.400</text>

    <!-- Bottom Spacer -->
    <rect x="20" y="200" width="320" height="40" rx="4" fill="#312e81" stroke="#4f46e5" stroke-dasharray="3"/>
    <text x="180" y="225" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="middle">Bottom Spacer (p.401 ~ p.800 높이 대치: 443,980px)</text>

    <text x="180" y="262" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">전체 스크롤바 정밀도: 800 × 1,124px = 899,200px</text>
  </g>

  <!-- Right: LRU Eviction Flow -->
  <g transform="translate(440, 100)" filter="url(#cardShadow)">
    <rect width="420" height="280" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="210" y="30" fill="#a7f3d0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      10페이지 LRU 캐시 및 축출 (Eviction) 메커니즘
    </text>

    <rect x="20" y="55" width="380" height="60" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="35" y="78" fill="#d1fae5" font-family="sans-serif" font-size="11" font-weight="bold">LRU Queue (최대 10개 슬롯)</text>
    <text x="35" y="98" fill="#6ee7b7" font-family="monospace" font-size="10">[p.391, p.392, ..., p.399, p.400] (Size: 10)</text>

    <!-- Action: Access new page -->
    <g transform="translate(20, 130)">
      <rect width="380" height="50" rx="6" fill="#1e293b" stroke="#3b82f6"/>
      <text x="15" y="22" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">신규 페이지 접근 시 (p.401 호출)</text>
      <text x="15" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="10">-> 가장 오래된 p.391 자동 축출 (URL.revokeObjectURL 실행)</text>
    </g>

    <!-- Guard Guarantee Result -->
    <g transform="translate(20, 195)">
      <rect width="380" height="65" rx="6" fill="#047857" stroke="#34d399"/>
      <text x="190" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        🛡️ 메모리 가드 보장 효과 (Zero DOM Hang)
      </text>
      <text x="190" y="45" fill="#d1fae5" font-family="sans-serif" font-size="10.5" text-anchor="middle">
        800쪽 전권 스크롤 시에도 메모리 38MB 미만 및 60 FPS 유지
      </text>
    </g>
  </g>
</svg>
